<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/css/style.css" type="text/css" />
    <script src="/javascript/script.js" defer></script>
    <title>Groceryee Shop</title>
  </head>
  <body>
    <!-- Banner Section -->
    <div class="banner">
      <div class="slides" id="slides">
        <div class="slide">
          <img src="/media/image.jpg" alt="Slide 1" />
          <div class="banner-text">
            <p>FRESH </p>
            <h1>Grocery</h1>
            <p>DELIVERED TO YOUR SEAT</p>
          </div>
        </div>
        <div class="slide">
          <img src="/media/image2.jpg" alt="Slide 2" />
          <div class="banner-text">
            <p>FRESH </p>
            <h1>Grocery</h1>
            <p>DELIVERED TO YOUR SEAT</p>
          </div>
        </div>
        <div class="slide">
          <img src="/media/image3.jpg" alt="Slide 3" />
          <div class="banner-text">
            <p>FRESH </p>
            <h1>Grocery</h1>
            <p>DELIVERED TO YOUR SEAT</p>
          </div>
        </div>
      </div>
    </div>

    <!-- Products Section -->
    <div class="products-container">
      <!-- New Products -->
      <div class="section">
        <h2>New Products</h2>
        <div class="product-list">
          <div class="product-item">
            <img src="/media/parachute.jpg" alt="Parachute Coconut Oil" />
            <div class="product-info">
              <h4>Parachute Coconut Oil</h4>
              <p>&#8377 30.00</p>
            </div>
            <button class="add-to-cart">Add to Cart</button>
          </div>
          <div class="product-item">
            <img src="/media/oliveoil.jpg" alt="BORGES Olive Oil" />
            <div class="product-info">
              <h4>BORGES Olive Oil</h4>
              <p>&#8377 80.00</p>
            </div>
            <button class="add-to-cart">Add to Cart</button>
          </div>
          <div class="product-item">
            <img src="/media/pureoil.jpg" alt="Figaro Pure Oil" />
            <div class="product-info">
              <h4>Figaro Pure Oil</h4>
              <p>&#8377 100.00</p>
            </div>
            <button class="add-to-cart">Add to Cart</button>
          </div>
        </div>
      </div>

      <!-- Popular Products -->
      <div class="section">
        <h2>Popular Products</h2>
        <div class="product-list">
          <div class="product-item">
            <img src="/media/pamper.jfif" alt="Pamper Pants" />
            <div class="product-info">
              <h4>Pamper Pants</h4>
              <p>&#8377 70.00</p>
            </div>
            <button class="add-to-cart">Add to Cart</button>
          </div>
          <div class="product-item">
            <img src="/media/mango.jpg" alt="Mango Juice" />
            <div class="product-info">
              <h4>Mango Juice</h4>
              <p>&#8377 20.00</p>
            </div>
            <button class="add-to-cart">Add to Cart</button>
          </div>
          <div class="product-item">
            <img src="/media/almond.jpg" alt="Almond" />
            <div class="product-info">
              <h4>Almond</h4>
              <p>&#8377 500.00</p>
            </div>
            <button class="add-to-cart">Add to Cart</button>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
